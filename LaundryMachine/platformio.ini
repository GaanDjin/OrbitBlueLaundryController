; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[common]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino
lib_deps  =
    moononournation/GFX Library for Arduino@^1.6.5
    computer991/Arduino_MFRC522v2@^2.0.1
    bblanchon/ArduinoJson@^7.4.2
platform_packages = 
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git
upload_resetmethod = default
monitor_rts = 0
monitor_dtr = 0
monitor_speed = 115200

; ── Development (your bench unit) ────────────────────────────────────────────
[env:dev]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
upload_port   = COM4
monitor_port  = COM4
monitor_speed = ${common.monitor_speed}
upload_resetmethod = ${common.upload_resetmethod}
monitor_rts = ${common.monitor_rts}
monitor_dtr = ${common.monitor_dtr}
build_flags =
    -D HAS_DISPLAY
    -D HAS_TOUCH
    -D HAS_LED_RED
    -D RELAY_ON_START
    -D FIRMWARE_PROFILE='"dev"'
    -D FIRMWARE_VERSION='"1.1.2"'

; ── Dryer profile ─────────────────────────────────────────────────────────────
[env:dryer]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
upload_resetmethod = ${common.upload_resetmethod}
monitor_rts = ${common.monitor_rts}
monitor_dtr = ${common.monitor_dtr}
build_flags =
    -D HAS_DISPLAY
    -D HAS_TOUCH
    -D RELAY_ON_START
    -D RELAY_ACTIVE=false
    -D FIRMWARE_PROFILE='"dryer"'
    -D FIRMWARE_VERSION='"1.1.7"'

; ── Washer profile ────────────────────────────────────────────────────────────
[env:washer]
platform  = ${common.platform}
board     = ${common.board}
framework = ${common.framework}
lib_deps  = ${common.lib_deps}
upload_resetmethod = ${common.upload_resetmethod}
monitor_rts = ${common.monitor_rts}
monitor_dtr = ${common.monitor_dtr}
build_flags =
    -D HAS_LED_RED
    -D HAS_MACHINE_BUSY
    -D FIRMWARE_PROFILE='"washer"'
    -D FIRMWARE_VERSION='"1.1.4"'
